<!DOCTYPE html>
<!-- ===== 对应笔记 7.5 前后端联调实战 ===== -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7.5 联调页面 · 笔记 API</title>
    <style>
        /* 这一页由 FastAPI 直接托管，所以样式内联，不依赖任何外部文件 */
        :root {
            --text: #0f172a;
            --muted: #64748b;
            --bg: #f5f7fb;
            --card: #ffffff;
            --border: #e2e8f0;
            --primary: #2563eb;
            --weak: #eef4ff;
            --danger: #dc2626;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #e2e8f0;
                --muted: #94a3b8;
                --bg: #0f172a;
                --card: #16233a;
                --border: #24344d;
                --primary: #60a5fa;
                --weak: #1e3a5f;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0 auto;
            padding: 24px;
            max-width: 760px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg);
        }

        h1 { margin: 0 0 4px; font-size: 22px; }
        h2 { margin: 0 0 12px; font-size: 17px; }

        .sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }

        .card {
            margin-bottom: 16px;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }

        .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 160px; }
        .field label { font-size: 13px; color: var(--muted); }

        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            font: inherit;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--weak);
            border-color: var(--primary);
        }

        button {
            padding: 8px 16px;
            font: inherit;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover { filter: brightness(1.06); }
        button:disabled { opacity: .5; cursor: not-allowed; }

        button.ghost {
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
        }

        button.ghost:hover { color: var(--danger); border-color: var(--danger); }

        ul { margin: 0; padding: 0; list-style: none; }

        li {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        li:last-child { border-bottom: none; }

        .note-main { flex: 1; min-width: 0; }
        .note-title { font-weight: 600; word-break: break-word; }
        .note-meta { font-size: 12px; color: var(--muted); }

        .tag {
            display: inline-block;
            padding: 0 8px;
            margin-left: 8px;
            font-size: 12px;
            font-weight: 400;
            color: var(--primary);
            background: var(--weak);
            border-radius: 999px;
        }

        .hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
        .hint.error { color: var(--danger); }

        code {
            padding: 1px 6px;
            font-size: 13px;
            color: var(--primary);
            background: var(--weak);
            border-radius: 4px;
        }

        /* 不写这条的话深色模式下链接是浏览器默认深蓝，几乎看不见 */
        a { color: var(--primary); }
    </style>
</head>
<body>
    <h1>笔记 API 联调</h1>
    <p class="sub">数据来自本机的 FastAPI 服务（<code>/api/notes</code>），页面和接口同源，所以没有跨域问题。</p>

    <section class="card">
        <h2>新增一条</h2>
        <div class="row">
            <div class="field">
                <label for="title">标题</label>
                <input id="title" type="text" maxlength="120" placeholder="例如：联调第一步">
            </div>
            <div class="field">
                <label for="statusInput">状态</label>
                <select id="statusInput">
                    <option value="draft">draft 草稿</option>
                    <option value="published">published 已发布</option>
                </select>
            </div>
            <button type="button" id="createBtn">提交</button>
        </div>
        <p class="hint" id="formHint">标题为空时接口会返回 422，可以顺手验证一下统一错误格式。</p>
    </section>

    <section class="card">
        <h2>列表</h2>
        <div class="row">
            <div class="field">
                <label for="filter">筛选</label>
                <select id="filter">
                    <option value="">全部</option>
                    <option value="published">只看已发布</option>
                    <option value="draft">只看草稿</option>
                </select>
            </div>
            <button type="button" class="ghost" id="reloadBtn">重新加载</button>
        </div>
        <p class="hint" id="listHint">加载中…</p>
        <ul id="noteList"></ul>
    </section>

    <p class="hint">接口文档在 <a href="/docs">/docs</a>；想复现跨域，把本页复制到 8080 的静态服务上再请求 8000 即可。</p>

    <script src="app.js"></script>
</body>
</html>
