# ===== 对应笔记 9.2 HTTPS 证书申请与配置 =====
#
# ⚠️ 只读参考：不要在本机执行
#
# 证书来源（两条路，选一条）：
#   1. Let's Encrypt 免费证书：sudo certbot --nginx -d example.com -d www.example.com
#      certbot 会自动改写本文件里 443 段的前两行路径，其余配置保留
#   2. 云厂商申请的证书：把 .pem / .key 传到 /etc/nginx/ssl/ 下，改下面两行路径
#
# 生效前必须：sudo nginx -t && sudo systemctl reload nginx
# 证书到期：certbot 自带 systemd timer 自动续期，用 `sudo certbot renew --dry-run` 演练一次

# ---------- 80 端口：只留证书校验 + 强制跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # ACME 校验文件必须能从 80 端口访问，续期才不会失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 301 是永久跳转，浏览器会记住；不要用 302
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 端口：真正干活的配置 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Nginx 1.25.1 起推荐单独开 http2，不再写进 listen 行
    http2 on;

    server_name example.com www.example.com;

    # certbot 生成的路径；fullchain 要包含中间证书，否则部分安卓机不认
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # 只留 TLS 1.2 / 1.3：1.0 和 1.1 已被主流浏览器判定为不安全
    ssl_protocols TLSv1.2 TLSv1.3;

    # 加密套件交给客户端选（现代客户端的选择通常更优），下面这行是官方推荐写法
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # 会话复用：减少重复握手的 CPU 开销
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling：由服务器代客户端去查证书状态，加快握手；
    # 必须配 trusted_certificate，否则部分环境下 stapling 不生效
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
    resolver 223.5.5.5 119.29.29.29 valid=300s;

    # HSTS：告诉浏览器「以后只走 HTTPS」。
    # ⚠️ 先确认全站 HTTPS 没问题再加 preload，否则加错了浏览器会直接拒绝访问
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    access_log /var/log/nginx/fullstack.access.log;
    error_log  /var/log/nginx/fullstack.error.log warn;

    client_max_body_size 10m;

    location /assets/ {
        root /srv/fullstack/frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://fullstack_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 这里恒为 https：后端拼绝对 URL 时要靠它
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location / {
        root /srv/fullstack/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}

# 常见故障对照：
#   SSL_ERROR_NO_CYPHER_OVERLAP  → 客户端太老，或证书链缺中间证书
#   网页提示「证书名称不匹配」   → server_name 与证书里的域名不一致，www 和裸域要都申请
#   续期后仍是旧证书             → 忘了 reload nginx；certbot 的 deploy-hook 要配
#   一直跳转循环                 → 后端又判断了一次协议，检查 X-Forwarded-Proto 是否传了
