# ===== 对应笔记 8.4 使用 Nginx 反向代理 / 8.6 Nginx 与 Uvicorn 部署 FastAPI =====
#
# ⚠️ 只读参考：这是服务器上的配置，不要在本机直接执行或覆盖系统 nginx.conf
#
# 放置位置：Ubuntu/Debian 放 /etc/nginx/sites-available/fullstack.conf
#          再软链到 /etc/nginx/sites-enabled/ 下
# 校验与生效：
#   sudo nginx -t          # 先测语法，通过才 reload，否则会中断线上服务
#   sudo systemctl reload nginx
#
# 这一份是「只有 HTTP」的版本，用于 8.4 讲清反向代理；
# HTTPS 版本见同目录 https.conf（9.2），上线后应换成那一份。

# upstream：把后端地址起个名字，好处是以后要扩成多实例只改这里
upstream fullstack_app {
    # 只监听 127.0.0.1：后端不直接对外，所有流量必须经过 Nginx
    server 127.0.0.1:8000;

    # 与后端保持长连接，减少每次请求重建 TCP 的开销（Nginx 1.15.3+ 支持）
    keepalive 32;
}

server {
    # 监听 80；IPv6 也要单独写一行，否则部分客户端连不上
    listen 80;
    listen [::]:80;

    # 换成你自己的域名；证书申请时 ACME 校验也会用到这个值
    server_name example.com www.example.com;

    # 访问日志 / 错误日志分开，排障时先看 error.log 的 warn 以上
    access_log /var/log/nginx/fullstack.access.log;
    error_log  /var/log/nginx/fullstack.error.log warn;

    # 允许上传的最大请求体，默认 1m 太小，传图片会直接 413
    client_max_body_size 10m;

    # ---------- 静态资源：交给 Nginx 直接发，不经过 Python ----------
    location /assets/ {
        root /srv/fullstack/frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 接口：反向代理到 uvicorn ----------
    location /api/ {
        # 注意结尾没有斜杠：保留原始路径 /api/notes 原样转发给后端。
        # 写成 proxy_pass http://fullstack_app/; 会把 /api 前缀吃掉，后端只剩 /notes
        proxy_pass http://fullstack_app;

        # 用 HTTP/1.1 才能复用 upstream 的长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 这四个头必须传：否则后端拿到的客户端 IP 全是 127.0.0.1，
        # 生成绝对链接时协议也会错成 http
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端处理超时：默认 60s，跑批处理接口要相应调大
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- 其余请求：单页应用回退到 index.html ----------
    location / {
        root /srv/fullstack/frontend/dist;
        # 依次尝试：文件 → 目录 → index.html，
        # 前端路由（/notes/1 这类）刷新时不会 404
        try_files $uri $uri/ /index.html;
    }

    # ---------- 健康检查：只允许内网访问，避免暴露内部状态 ----------
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://fullstack_app/api/health;
    }
}
